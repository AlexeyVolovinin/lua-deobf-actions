name: Deobfuscate Lua Script

on:
  workflow_dispatch:
    inputs:
      obfuscator:
        description: 'Obfuscator type: auto|luraph|prometheus|moonsec|ironbrew|medal'
        required: true
        default: 'luraph'
      channel_id:
        description: 'Discord channel ID for response'
        required: false
        default: ''

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup all runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 luajit unzip
          dotnet --version || true
          python3 --version
          node --version
          java -version 2>&1 | head -1

      - name: Setup .NET
        if: ${{ github.event.inputs.obfuscator == 'auto' || github.event.inputs.obfuscator == 'luraph' || github.event.inputs.obfuscator == 'ironbrew' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Setup Rust
        if: ${{ github.event.inputs.obfuscator == 'auto' || github.event.inputs.obfuscator == 'medal' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node deps
        run: |
          cd src/white && npm install --production 2>/dev/null || true
          cd ../lua-deobf/Lua-Deobfuscator && npm install --production 2>/dev/null || true

      - name: Write input script
        run: |
          if [ -f input.lua ]; then
            echo "Using input.lua from repository"
          else
            echo 'print("err: input.lua not found in repo")' > input.lua
          fi
          echo "=== INPUT ==="
          wc -c input.lua
          head -5 input.lua

      - name: Detect obfuscator
        run: |
          python3 src/detect.py input.lua 2>&1 | tee detection.txt

      - name: Run Python deobfuscator (always)
        run: |
          python3 src/deobfuscator.py input.lua output_py.lua 2>&1

      - name: White (Prometheus/Luraph JS)
        if: ${{ github.event.inputs.obfuscator == 'auto' || github.event.inputs.obfuscator == 'prometheus' || github.event.inputs.obfuscator == 'luraph' }}
        run: |
          cd src/white && cp ../../input.lua . && node main.js 2>&1 | tee /tmp/white.log || echo "WHITE: no output"

      - name: Luraph C# deobfuscator
        if: ${{ github.event.inputs.obfuscator == 'auto' || github.event.inputs.obfuscator == 'luraph' }}
        run: |
          cd src/luraph-csharp
          dotnet restore 2>/dev/null
          dotnet build -c Release -o out 2>&1 | tail -3
          dotnet out/LuraphDeobfuscator.dll --input ../../input.lua 2>&1 | tee /tmp/luraph_cs.log || echo "LURAPH_CS: no output"

      - name: Ironbrew C# deobfuscator
        if: ${{ github.event.inputs.obfuscator == 'auto' || github.event.inputs.obfuscator == 'ironbrew' }}
        run: |
          cd src/ironbrew/IronbrewDeobfuscator
          dotnet restore 2>/dev/null
          dotnet build -c Release -o out 2>&1 | tail -3
          dotnet out/IronbrewDeobfuscator.dll -t ib2 -f ../../../input.lua 2>&1 | tee /tmp/ib2.log || echo "IB2: no output"

      - name: medal-decompiler (Rust)
        if: ${{ github.event.inputs.obfuscator == 'auto' || github.event.inputs.obfuscator == 'medal' }}
        run: |
          cd src/medal-decompiler
          cargo build --release 2>&1 | tail -3
          echo "medal: need specific invocation" > /tmp/medal.log || true

      - name: Lua-Deobfuscator (MoonSec V2 / IronBrew JS)
        if: ${{ github.event.inputs.obfuscator == 'auto' || github.event.inputs.obfuscator == 'moonsec' || github.event.inputs.obfuscator == 'ironbrew' }}
        run: |
          cd src/lua-deobf/Lua-Deobfuscator
          cp ../../input.lua .
          node index.js 2>&1 | tee /tmp/luadeobf.log || echo "LUA_DEOBF: no output"

      - name: Collect all results
        run: |
          echo "=== RESULTS ===" > results.md
          date >> results.md
          echo "Obfuscator: ${{ github.event.inputs.obfuscator }}" >> results.md
          echo "" >> results.md
          for f in /tmp/*.log detection.txt output_py.lua; do
            echo "--- $(basename $f) ---" >> results.md
            head -100 "$f" 2>/dev/null >> results.md
            echo "" >> results.md
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deobf-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output_py.lua
            input.lua
            results.md

      - name: Send Discord result
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "No webhook secret set"; exit 0; fi
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"**✅ Деобф \\\"${{ github.event.inputs.obfuscator }}\\\" завершен!**\nБайт: $(wc -c < input.lua) → $(wc -c < output_py.lua 2>/dev/null)\n\`\`\`$(head -20 output_py.lua 2>/dev/null | sed 's/"/\\"/g' | tr '\n' ' ' | cut -c1-1500)\`\`\`\"}" \
            "$WEBHOOK_URL" || true
